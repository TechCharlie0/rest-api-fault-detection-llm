name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Create virtual environment
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install pip --upgrade

      - name: Install dependencies
        run: |
          . .venv/bin/activate
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          . .venv/bin/activate
          pytest -q

      - name: Lint
        run: |
          . .venv/bin/activate
          ruff check agenticapi tests

      - name: Type check
        run: |
          . .venv/bin/activate
          mypy agenticapi

      - name: Verify dataset hashes
        run: |
          . .venv/bin/activate
          sha256sum -c datasets/SHA256SUMS

      - name: Verify original artifacts unchanged
        run: |
          . .venv/bin/activate
          bash scripts/verify_original_unchanged.sh